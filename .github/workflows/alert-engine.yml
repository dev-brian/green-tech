name: Motor de Alertas y Simulador (Plan B Spark)

# Plan B de T11.5 (#30): Ejecución sin plan de pago Firebase Blaze usando Admin SDK.
# Nota: En GitHub Actions el disparador `schedule` (cron) solo se ejecuta cuando este
# archivo está en la rama por defecto (`main`). En ramas de trabajo o antes de fusionar
# a `main`, se dispara manualmente con `workflow_dispatch` ("Run workflow").
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Escenario hidropónico'
        type: choice
        required: false
        default: 'normal'
        options:
          - normal
          - ph-alto
          - ec-baja
          - tanque-bajo
          - solucion-caliente
          - ola-de-calor

permissions:
  contents: read

jobs:
  evaluate-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ejecutar ciclo de ingesta, motor de alertas y purga (7 y 30 días) en todos los invernaderos
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DEVICE_INGEST_KEY: ${{ secrets.DEVICE_INGEST_KEY }}
          # Al tocar un push de alerta crítica se abre la bandeja de la PWA publicada
          PWA_URL: https://dev-brian.github.io/green-tech/
          # Auditoría A7: el valor del formulario pasa por env, nunca se inserta
          # en el script; así no puede ejecutar comandos con la cuenta de servicio.
          SCENARIO: ${{ github.event.inputs.scenario || 'normal' }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] || [ -z "$DEVICE_INGEST_KEY" ]; then
            echo "::error::Faltan secretos requeridos en GitHub (FIREBASE_SERVICE_ACCOUNT o DEVICE_INGEST_KEY)."
            exit 1
          fi
          case "$SCENARIO" in
            normal|ph-alto|ec-baja|tanque-bajo|solucion-caliente|ola-de-calor) ;;
            *) echo "::error::Escenario no válido."; exit 1 ;;
          esac
          # --all: cada invernadero recibe lecturas de las zonas y cultivos que
          # registró en la PWA (ya no hace falta el secreto GREENHOUSE_ID).
          node simulator/cli.ts --firestore --all --once --prune --scenario="$SCENARIO"
