name: Motor de Alertas y Simulador (Plan B Spark)

# Plan B de T11.5 (#30): Ejecución sin plan de pago Firebase Blaze.
# Corre cada 5 minutos o bajo demanda (workflow_dispatch) con escenario configurable.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Escenario hidropónico (normal, ph-alto, ec-baja, tanque-bajo, solucion-caliente, ola-de-calor)'
        required: false
        default: 'normal'

permissions:
  contents: read

jobs:
  evaluate-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Ejecutar ciclo de ingesta y motor de alertas
        env:
          GREENHOUSE_ID: ${{ secrets.GREENHOUSE_ID || 'demo-greenhouse' }}
          DEVICE_INGEST_KEY: ${{ secrets.DEVICE_INGEST_KEY || 'gt-dev-device-key-2026' }}
        run: |
          SCENARIO="${{ github.event.inputs.scenario || 'normal' }}"
          node simulator/cli.ts --once --scenario="$SCENARIO"
