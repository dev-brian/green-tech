# Cómo se agrupan y a dónde se mandan las alertas.
# La URL del webhook de Slack va en monitoring/secrets/slack_webhook (no se sube a git).
route:
  receiver: slack-equipo
  group_by: [alertname, zone]   # un mensaje por regla y zona
  group_wait: 30s               # espera para juntar alertas que llegan juntas
  group_interval: 5m            # cada cuánto avisa cambios dentro del grupo
  repeat_interval: 2h           # recordatorio si la alerta sigue activa
  routes:
    - matchers: ['severity="info"']
      receiver: slack-equipo
      repeat_interval: 12h

inhibit_rules:
  # Si la ingesta está caída, no tiene caso avisar zona por zona.
  - source_matchers: ['alertname="IngestaCaida"']
    target_matchers: ['alertname=~"ZonaSinDatos|LecturasRechazadas|IngestaLenta"']

receivers:
  - name: slack-equipo
    slack_configs:
      - api_url_file: /etc/alertmanager/slack_webhook
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} GreenTech · {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
